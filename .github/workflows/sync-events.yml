name: Auto-Sync Combat Sports Events

on:
  schedule:
    # Automatically check UFC, PFL, RAF Wrestling, and BKFC every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/sync_events.py'

permissions:
  contents: write

concurrency:
  group: sync-combat-events
  cancel-in-progress: false

jobs:
  sync-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync latest official events from UFC, PFL, RAF Wrestling, and BKFC
        run: python3 scripts/sync_events.py

      - name: Commit and push updated events if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data/events.json; then
            git add data/events.json
            git commit -m "chore(events): auto-sync latest UFC, PFL, RAF & BKFC events"
            git push
          else
            echo "No event schedule changes detected."
          fi
